rag:
  python:
#    url: ${RAG_SERVICE_URL:http://localhost:8000/rag/query}
    # Mosingnpdocker run -d --name redis -p 6379:6379 redis:latest --requirepass yourpassword

    url: ${RAG_SERVICE_URL:http://192.168.3.16:8000/rag/query}

ai:
  dialogue-command:
    enabled: ${AI_DIALOGUE_COMMAND_ENABLED:true}
    url: ${AI_DIALOGUE_COMMAND_URL:http://localhost:8000/ai/dialogue/commands}
    auto-resume-read-only: ${AI_DIALOGUE_AUTO_RESUME_READ_ONLY:true}
  chat:
    url: ${AI_CHAT_URL:http://192.168.3.16:8000/ai/chat/invoke}

spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: ${SERVER_PORT:9091}

bank:
  skills:
    config:
      sqlite-path: ${SKILL_CONFIG_SQLITE_PATH:data/bank-chat-skill-config.db}
    customer:
      core-simulator:
        latency-ms: ${CORE_BANK_SIMULATOR_LATENCY_MS:30}
    internal:
      api-key: ${INTERNAL_SKILL_API_KEY:local-dev-internal-key}
      api-key-header: X-Internal-Api-Key
      message-operation-ttl: PT10M
