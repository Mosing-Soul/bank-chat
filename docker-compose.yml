name: bank-chat

networks:
  bank-net:
    driver: bridge

volumes:
  redis-data:
  rag-vector-data:
  huggingface-cache:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-python-environment: &python-environment
  PYTHON_SERVICE_HOST: 0.0.0.0
  PYTHON_SERVICE_PORT: 8000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  BANK_DOCS_FOLDER: /app/assets
  VECTOR_DB_DIR: /app/chroma_db
  BUILD_DOCUMENTS_DIR: /app/assets
  BUILD_VECTOR_DB_DIR: /app/chroma_db
  EMBEDDING_DEVICE: cpu

x-python-volumes: &python-volumes
  - ./bank-agent-demo/assets:/app/assets:ro
  - rag-vector-data:/app/chroma_db
  - huggingface-cache:/root/.cache/huggingface

services:
  redis:
    image: redis:7-alpine
    container_name: bank-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bank-net]
    logging: *default-logging

  python-rag:
    image: bank-chat-python-rag:latest
    build:
      context: ./bank-agent-demo
    container_name: bank-python-rag
    restart: unless-stopped
    env_file: ["${DEPLOY_ENV_FILE:-./.env.deploy}"]
    environment: *python-environment
    volumes: *python-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert data['status']=='ok' and data['vectorStoreReady']"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks: [bank-net]
    logging: *default-logging

  java-backend:
    image: bank-chat-java-backend:latest
    build:
      context: ./bank-chat-middle-platform
    container_name: bank-java
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RAG_SERVICE_URL: http://python-rag:8000/rag/query
      AI_CHAT_URL: http://python-rag:8000/ai/chat/invoke
      AI_DIALOGUE_COMMAND_ENABLED: "false"
      INTERNAL_SKILL_API_KEY: ${INTERNAL_SKILL_API_KEY:?INTERNAL_SKILL_API_KEY is required}
      ANALYTICS_VIEW_PATH: ${ANALYTICS_VIEW_PATH:-/api/analytics/admin}
      ANALYTICS_WHITELIST_CLIENT_IDS: ${ANALYTICS_WHITELIST_CLIENT_IDS:-}
    volumes:
      - ./data/java-backend:/app/data
    expose:
      - "9091"
    depends_on:
      redis:
        condition: service_healthy
      python-rag:
        condition: service_healthy
    networks: [bank-net]
    logging: *default-logging

  frontend:
    image: bank-chat-frontend:latest
    build:
      context: ./bank-front-end
    container_name: bank-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on: [java-backend]
    networks: [bank-net]
    logging: *default-logging
